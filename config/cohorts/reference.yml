# Layer 1 cohort: every cell in the freeze.
# QC, integration, clustering and annotation run here and ONLY here.
cohort_id: reference
description: >
  All cells in the freeze: both arms, all timepoints, healthy controls.
  Used to build the shared label space. More cells give better cluster
  definitions and rare-state detection, and a single common label space
  is required for any cross-cohort comparison.
layer: 1
include: {}          # no filtering
exclude_post_escape: false
notes: >
  Never subset here. Integration must correct on batch_id only — not on
  sample_id, Subject_ID or timepoint, because within-patient change
  across timepoints is the signal of Project 1.

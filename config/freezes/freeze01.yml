# ==============================================================
# config/freezes/freeze01.yml
#
# A FREEZE is an immutable declaration of which libraries are in the
# dataset. It is the cohort-version axis — not the code-version axis
# (git handles that) and not the sample-selection axis (cohorts handle
# that).
#
# When the resequenced libraries land, do NOT edit this file. Write
# freeze02.yml and re-run with --freeze freeze02. Nothing is
# overwritten, and freeze01 vs freeze02 becomes a free robustness check
# you can report in the paper.
#
# After completing an analysis on a freeze, tag the code:
#   git tag -a freeze01-analysis -m "Code state used for freeze01 results"
# ==============================================================

freeze_id: freeze01
created: 2026-09-23
status: active          # active | closed | superseded
description: >
  First-pass cohort: the 221 libraries in the colleague's sample map
  (209 SSc from 79 subjects, both arms, M00/M03/M06; 12 healthy
  controls). freeze02 will ADD ~20 newly sequenced samples; they do not
  replace any library here.

# ---- sources -------------------------------------------------
# Read by analysis/00_manifest_and_batch/00_0_import_raw_libraries.R,
# which copies everything into data/raw/ with md5 verification. After
# that, nothing downstream reads these paths.
sources:
  sample_map: /home/jarnagin/ASSET_Flex/results/demo.txt
  sample_map_owner: jarnagin
  cellranger_outputs: >
    /hits/Johann_Novaseq/fastq/<run>/10x_analysis_<run>/Sample_<run>-Pool01
    (SSc and 12952-JF controls); /hits/home/wasikowr/ffpe/{8911_JF,9260_JF}/outs
    (5 controls)

# ---- processing provenance -----------------------------------
# Read from each pool's config.csv and web_summary.html on 2026-09-29.
# Probe-based Flex: the panel is NOT whole-transcriptome, which
# constrains which genes can be asked about at all.
platform: "10x Genomics Flex"
chemistry: "TODO"                      # TODO confirm
probe_set: "Chromium_Human_Transcriptome_Probe_Set_v1.1.0_GRCh38-2024-A"
cellranger_version: "cellranger-9.0.1"   # verified per pool by 00_0
reference: "refdata-gex-GRCh38-2024-A"
fixation: "FFPE"                       # TODO confirm

# ---- cohort composition --------------------------------------
# TODO fill from the sample manifest once received
n_libraries: 218                       # 221 imported - 3 failed (excluded_libraries)
n_subjects_ssc: 79
n_subjects_hc: 12
n_cells_estimate: 1300000

timepoints: [M00, M03, M06]
arms: [Placebo, Abatacept]
groups: [SSc, HC]

# ---- exclusions ----------------------------------------------
# One entry per excluded library, with a reason. If a library is
# excluded for a reason correlated with arm or timepoint, flag it: that
# is informative missingness, not just a QC problem.
excluded_libraries:
  # Failed libraries (cell QC R0013; owner decision 2026-10-01). One per
  # timepoint, so not obviously design-correlated; candidates for the
  # resequencing that becomes freeze02.
  - library_id: 13718-JF-14
    reason: "cell calling failed: 87,685 barcodes, median 3 UMI/cell, 0 pass QC"
    correlated_with_design: false
  - library_id: 13719-JF-10
    reason: "failed: 1,144 barcodes, median 7 UMI/cell, 0 pass QC"
    correlated_with_design: false
  - library_id: 13596-JF-9
    reason: "cell calling failed: 17,557 barcodes, median 107 UMI/cell, 127 pass QC"
    correlated_with_design: false
# Example:
#   - library_id: LIB_0113
#     reason: "median genes/cell < 400"
#     correlated_with_design: false
#   - library_id: LIB_0147
#     reason: "ambient fraction > 0.4"
#     correlated_with_design: false

# ---- library flags -------------------------------------------
# Libraries that stay in the freeze (they help define cell types in
# Layer 1) but carry a design problem. Any flagged library is excluded
# from every Layer-2 cohort by cohort_samples() until the flag is
# resolved. 00_0 copies the flag into the manifest's design_flag column.
library_flags:
  - library_id: 13639-JF-11
    flag: timepoint_unresolved
    note: "Same subject as 13639-JF-12: both labelled Month 3, no Baseline.
           One is probably a mislabelled Baseline. Ask colleague / DCC."
  - library_id: 13639-JF-12
    flag: timepoint_unresolved
    note: "See 13639-JF-11."

# ---- QC review (informational) --------------------------------
# Weak libraries KEPT in the freeze and in cohorts (owner decision
# 2026-10-01), listed so any result can be checked without them. Not
# read by cohort_samples(); unlike library_flags they do not exclude.
qc_review_libraries:
  - {library_id: 13481-JF-8,  note: "492 of 1,025 cells pass; weak library"}
  - {library_id: 13719-JF-7,  note: "3,123 of 6,256 pass; shallow (median 500 UMI), floor removes half"}
  - {library_id: 8911-JF-14,  note: "HC; 174 of 490 pass; forced-cells re-run"}
  - {library_id: 9260-JF-16,  note: "HC; 274 of 1,000 pass; forced-cells re-run"}

# ---- resolved membership -------------------------------------
# Written by analysis/00_manifest_and_batch/00_1_build_manifest.R so the
# freeze stays reproducible even if the manifest changes later.
libraries_file: metadata/freeze01_libraries.txt

# ---- known caveats -------------------------------------------
caveats:
  - "Batch structure not yet checked against timepoint and arm. Run
     analysis/00_manifest_and_batch/ before any biological analysis."
  - "Healthy controls were collected simultaneously; confirm whether they
     were captured in the same batches as SSc samples or clustered into
     their own."
  - "Serial biopsies were taken within ~1 cm of the prior site, so month 3
     and month 6 samples may carry repair/wound-healing biology."
